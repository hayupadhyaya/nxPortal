# Source of truth for the Xcode project; the generated NxPortal.xcodeproj is git-ignored.
# The bundle prefix and the signing team come from the build environment (scripts/client.sh), never from this file.
name: NxPortal
options:
  bundleIdPrefix: nxportal
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    PORTAL_BUNDLE_PREFIX: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  PortalKit:
    path: ../PortalKit
targets:
  NxPortal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/Acknowledgements.txt
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: PortalKit
        product: PortalPlayer
      - package: PortalKit
        product: PortalKit
      - package: PortalKit
        product: PortalClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PORTAL_BUNDLE_PREFIX).nxportal
        PRODUCT_NAME: NxPortal
        INFOPLIST_FILE: Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NxPortalTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources/Assets-tvOS.xcassets
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: PortalKit
        product: PortalPlayer
      - package: PortalKit
        product: PortalKit
      - package: PortalKit
        product: PortalClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PORTAL_BUNDLE_PREFIX).nxportal
        PRODUCT_NAME: NxPortal
        INFOPLIST_FILE: Resources/Info-tvOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
